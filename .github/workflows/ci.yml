name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Staging/CI use SQLite; nothing here touches a shared database.
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_STAGING: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Seed and smoke test
        run: |
          npx prisma db push --skip-generate
          npm run db:seed
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null http://localhost:3000/p/salt-line-trio
          curl -sf -o /dev/null http://localhost:3000/leaderboard
