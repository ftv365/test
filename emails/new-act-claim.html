<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>New act claim — {{actName}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7;">
  <!-- Preheader (hidden) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    {{requesterEmail}} wants to claim {{actName}}. Approve or reject their access.
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

          <!-- Header -->
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <p style="margin:0; font-size:13px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:#6b7280;">Myrtle365 Support</p>
              <h1 style="margin:12px 0 0 0; font-size:26px; line-height:1.25; font-weight:700; color:#111827;">New act claim</h1>
            </td>
          </tr>

          <!-- Act details -->
          <tr>
            <td style="padding:12px 32px 4px 32px;">
              <p style="margin:0; font-size:20px; font-weight:700; color:#111827;">{{actName}}</p>
              <p style="margin:8px 0 0 0; font-size:15px; color:#4b5563;">
                Requested by <a href="mailto:{{requesterEmail}}" style="color:#2563eb; text-decoration:none;">{{requesterEmail}}</a>
              </p>
            </td>
          </tr>

          <!-- Action buttons -->
          <tr>
            <td style="padding:24px 32px 8px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <!-- Approve: dark text on light background for readable contrast -->
                  <td style="border-radius:24px; background-color:#7fefd4;">
                    <a href="{{approveUrl}}"
                       style="display:inline-block; padding:13px 28px; font-size:16px; font-weight:700; color:#04463a; text-decoration:none; border-radius:24px; background-color:#7fefd4;">
                      &#10004;&nbsp; Approve
                    </a>
                  </td>
                  <td style="width:12px;">&nbsp;</td>
                  <!-- Reject: white text on red keeps strong contrast -->
                  <td style="border-radius:24px; background-color:#c0392b;">
                    <a href="{{rejectUrl}}"
                       style="display:inline-block; padding:13px 28px; font-size:16px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:24px; background-color:#c0392b;">
                      Reject
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Helper text -->
          <tr>
            <td style="padding:16px 32px 4px 32px;">
              <p style="margin:0; font-size:14px; color:#6b7280;">Approving confirms they run this act and grants them access.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px 32px 32px;">
              <p style="margin:0; font-size:14px; color:#9ca3af;">Myrtle365.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
